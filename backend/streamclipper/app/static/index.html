<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamClipper</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1b2230;--mut:#5d6879;--line:#d8dee8;--acc:#2f6fed;--accfg:#fff;--good:#1f8a4c;--edit:#b7791f;--bad:#c0392b;--warn:#8a5a00;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#11141a;--card:#1a1f28;--fg:#e8ecf3;--mut:#9aa6b8;--line:#2c3443;--acc:#7da5ff;--accfg:#0d1220;--good:#4cc582;--edit:#e0a93c;--bad:#ef6b5b;--warn:#e0b45a;--ok:#4cc582}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:8px;color:var(--fg);text-decoration:none;border:1px solid transparent}nav a.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.pill{margin-left:auto;font-size:12px;color:var(--mut)}
main{max-width:1180px;margin:0 auto;padding:18px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{min-height:44px;resize:vertical}
button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 160px}.row>.fix{flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button.on{background:var(--acc);color:var(--accfg)}
.mut{color:var(--mut)}.small{font-size:12px}.warn{color:var(--warn)}.err{color:var(--bad)}.ok{color:var(--ok)}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.badge.running{border-color:var(--acc);color:var(--acc)}.badge.completed{border-color:var(--ok);color:var(--ok)}.badge.failed,.badge.interrupted{border-color:var(--bad);color:var(--bad)}.badge.cancelled{color:var(--mut)}
.job{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.job h3{margin:0 0 4px}.stages{margin:8px 0;display:grid;gap:3px}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}.bar>i{display:block;height:100%;background:var(--acc)}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}.box.err{border-color:var(--bad)}.box.warn{border-color:var(--warn)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sess{cursor:pointer}.sess:hover{border-color:var(--acc)}.sess.legacy{opacity:.55;cursor:default}
.clip{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}@media (max-width:760px){.clip{grid-template-columns:1fr}}
video{width:100%;max-height:68vh;background:#000;border-radius:8px}
.rate{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rate button.on.good{border-color:var(--good);color:var(--good);font-weight:600}.rate button.on.edit{border-color:var(--edit);color:var(--edit);font-weight:600}.rate button.on.bad{border-color:var(--bad);color:var(--bad);font-weight:600}
details{margin:6px 0}summary{cursor:pointer;color:var(--acc)}.tx{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:980px;width:100%;padding:18px}
.cuerow{display:grid;grid-template-columns:64px 64px 1fr auto;gap:6px;align-items:start;margin:4px 0}.cuerow input{padding:4px 6px}
.cuerow.low textarea{border-color:var(--warn)}
.floatjob{position:fixed;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tl{position:relative;height:96px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;margin-top:6px;cursor:crosshair}
.tl canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tl .ov{position:absolute;top:0;bottom:0;pointer-events:none}
.tl .o-orig{background:rgba(150,150,150,.22);top:62%}.tl .o-ctx{border:2px solid #3e63dd;top:2px;bottom:36%;border-radius:3px}
.tl .o-ev{background:rgba(229,72,77,.28);top:0;bottom:70%}.tl .o-sel{background:rgba(48,164,108,.2);border-left:2px solid #30a46c;border-right:2px solid #30a46c}
.tl .h{width:14px;margin-left:-7px;background:#30a46c;opacity:.9;pointer-events:auto;cursor:ew-resize;border-radius:4px}
.tl .o-head{width:2px;background:var(--fg);opacity:.8}
.tl .ticks{position:absolute;left:0;right:0;bottom:0;height:12px;pointer-events:none}.tl .ticks i{position:absolute;top:0;bottom:0;background:rgba(62,99,221,.5);border-right:1px solid var(--card)}
.tl .ticks i.trn{top:-84px;bottom:0;width:2px!important;background:#ab4aba;border:0;opacity:.9}
.lg{display:inline-block;width:12px;height:10px;border-radius:2px;margin:0 4px 0 6px;vertical-align:middle}.lg.g1{background:#30a46c}.lg.g2{background:#999}.lg.g3{border:2px solid #3e63dd}.lg.g4{background:#e5484d}.lg.g5{background:#ab4aba}
.regbox{position:relative;display:inline-block;max-width:100%;margin-top:6px;cursor:crosshair;touch-action:none;user-select:none}.regbox img{display:block;max-width:100%;border-radius:6px}
.regbox .rects{position:absolute;inset:0;pointer-events:none}.regbox .rect{position:absolute;border:2px solid;font-size:11px;font-weight:700;background:rgba(0,0,0,.12)}
img.pv{width:100%;max-width:300px;border-radius:8px;border:1px solid var(--line);display:block;margin:4px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:99;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1>StreamClipper</h1>
  <nav id="nav"></nav>
  <span class="pill" id="pill"></span>
</header>
<main id="view"></main>
<script>
"use strict";
/* Todo el contenido dinámico se inserta con textContent/createTextNode: los títulos y transcripciones son datos de terceros. */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
async function api(url, body, method) {
  const opts = body === undefined ? {} : { method: method || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(url, opts);
  let data = {};
  try { data = await r.json(); } catch (e) { /* respuesta sin JSON */ }
  if (!r.ok) { const err = new Error(data.error || ("Error " + r.status)); err.data = data; err.status = r.status; throw err; }
  return data;
}
function toast(msg, ms) { const t = el("div", { class: "toast" }, msg); document.body.append(t); setTimeout(() => t.remove(), ms || 3500); }
const hms = (t) => { t = Math.max(0, Math.floor(t || 0)); return String(Math.floor(t / 3600)).padStart(2, "0") + ":" + String(Math.floor(t % 3600 / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const parseHms = (v) => { const m = /^(\d{1,3}):([0-5]\d):([0-5]\d)$/.exec(String(v || "").trim()); return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : null; };
const PAGE_CONTRACT = "__API_CONTRACT__";   // el servidor lo reemplaza al servir la página
async function loadConfig() {
  const c = await api("/api/config");
  if (String(c.contract) !== PAGE_CONTRACT)
    throw new Error("Esta ventana y el servidor de StreamClipper son de versiones distintas (hay una instancia anterior abierta). " +
      "Cerrá todas las ventanas negras de StreamClipper y volvé a abrir iniciar_streamclipper.bat.");
  return c;
}
const DETECTOR = { classic: "Clásica", smart: "Smart Highlights" };
const SIGNAL = { intensidad_audio: "intensidad de audio", dinamica_audio: "subida brusca de audio", energia_contexto: "energía vs. los 30 s previos",
  reaccion_vocal: "reacción vocal", risa_probable: "posible risa (no validada)", reaccion_verbal: "reacción verbal", frases: "frases de interés",
  arco_narrativo: "planteamiento → desenlace", contexto: "contexto antes/después", duracion: "duración", calidad_transcripcion: "calidad de la transcripción",
  visual: "cambio visual", musica_o_ruido: "ruido o música (resta)", audio_repetitivo: "audio repetitivo (resta)", aire_muerto: "aire muerto (resta)",
  transcripcion_dudosa: "transcripción dudosa (resta)", frase_incompleta: "corte a mitad de frase (resta)" };
const SEG_STATUS = { pending: "En espera", running: "En curso", done: "Listo", failed: "Falló", cancelled: "Cancelado" };
const mm = (s) => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
const fdate = (t) => new Date(t * 1000).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
const mediaUrl = (sess, rel) => "/media/" + encodeURIComponent(sess) + "/" + rel.split("/").map(encodeURIComponent).join("/");
const STATUS = { queued: "En cola", running: "En curso", completed: "Listo", failed: "Falló", cancelled: "Cancelado", interrupted: "Interrumpido" };
const ICON = { pending: "○", running: "◔", done: "✓", failed: "✗", cancelled: "⊘" };

let CONFIG = null, JOBS = [], pollTimer = null, currentView = null;

/* ---------- navegación ---------- */
const NAV = [["#/", "Nuevo"], ["#/sesiones", "Sesiones"], ["#/estado", "Estado del sistema"]];
function renderNav() {
  const h = location.hash || "#/";
  const nav = $("#nav"); nav.replaceChildren(...NAV.map(([href, label]) => el("a", { href, class: (h === href || (href === "#/sesiones" && (h.startsWith("#/sesion/") || h.startsWith("#/vod/") || h.startsWith("#/auto/")))) ? "on" : "" }, label)));
}
window.addEventListener("hashchange", route);
async function route() {
  renderNav();
  const h = location.hash || "#/";
  const view = $("#view");
  currentView = h;
  try {
    if (h === "#/") await viewNew(view);
    else if (h === "#/sesiones") await viewSessions(view);
    else if (h === "#/estado") await viewDoctor(view);
    else if (h.startsWith("#/sesion/")) await viewSession(view, decodeURIComponent(h.slice(9)));
    else if (h.startsWith("#/vod/")) await viewGroup(view, decodeURIComponent(h.slice(6)));
    else if (h.startsWith("#/auto/")) await viewAuto(view, decodeURIComponent(h.slice(7)));
    else view.replaceChildren(el("div", { class: "card" }, "Página no encontrada."));
  } catch (e) { view.replaceChildren(el("div", { class: "card err" }, "No se pudo cargar: " + e.message)); }
}

/* ---------- trabajos (compartido) ---------- */
function stageRow(s) {
  const running = s.status === "running";
  let right = "";
  if (s.status === "done" && s.seconds != null) right = s.seconds + " s";
  if (running && s.started) right = Math.max(0, Math.round(Date.now() / 1000 - s.started)) + " s";
  const main = el("div", {}, el("span", {}, s.label), s.detail ? el("span", { class: "mut small" }, "  " + s.detail) : null);
  if (running && s.fraction != null) main.append(el("div", { class: "bar" }, el("i", { style: "width:" + Math.round(s.fraction * 100) + "%" })));
  return el("div", { class: "stage" }, el("span", { class: s.status === "done" ? "ok" : s.status === "failed" ? "err" : "" }, ICON[s.status] || "○"), main,
    el("span", { class: "mut small" }, right));
}
function segCard(sg, j) {
  const box = el("div", { class: "box" + (sg.status === "failed" ? " err" : "") },
    el("div", {}, el("strong", {}, "Tramo " + (sg.index + 1) + " · " + hms(sg.start) + "–" + hms(sg.end)), " ",
      el("span", { class: "badge " + (sg.status === "done" ? "completed" : sg.status === "failed" ? "failed" : sg.status === "running" ? "running" : "cancelled") }, SEG_STATUS[sg.status] || sg.status),
      sg.status === "done" && sg.result && sg.result.clips != null ? el("span", { class: "mut small" }, "  " + sg.result.clips + " clip(s)") : null));
  if (sg.status === "running" || sg.status === "failed" || sg.status === "cancelled") box.append(el("div", { class: "stages" }, sg.stages.filter((x) => x.status !== "pending" || sg.status === "running").map(stageRow)));
  if (sg.message && sg.status === "pending") box.append(el("div", { class: "mut small" }, sg.message));
  for (const w of (sg.warnings || []).slice(0, 3)) box.append(el("div", { class: "small warn" }, "⚠ " + w));
  if (sg.error) { box.append(el("div", { class: "small err" }, sg.error)); if (sg.hint) box.append(el("div", { class: "small mut" }, "Sugerencia: " + sg.hint)); }
  if (sg.session && sg.status === "done") box.append(el("a", { href: "#/sesion/" + encodeURIComponent(sg.session) }, "Abrir los clips de este tramo"));
  return box;
}
const CHIP = { done: "var(--ok)", running: "var(--acc)", failed: "var(--bad)", cancelled: "var(--mut)", pending: "var(--line)" };
function autoCard(j) {
  const active = j.status === "queued" || j.status === "running";
  const n = j.segments.length, done = j.segments.filter((x) => x.status === "done").length;
  const cur = j.segments.find((x) => x.status === "running");
  const cands = j.segments.reduce((a, x) => a + ((x.result && x.result.candidates) || 0), 0);
  const elig = j.segments.reduce((a, x) => a + ((x.result && x.result.eligible) || 0), 0);
  const res = j.result || {}, sum = res.summary || null, rendered = Object.keys(res.rendered || {}).length;
  const box = el("div", { class: "job" },
    el("h3", {}, j.title || j.id, "  ", el("span", { class: "badge " + j.status }, STATUS[j.status] || j.status),
      j.status === "queued" && j.queue_position ? el("span", { class: "mut small" }, "  posición " + j.queue_position + " en la cola") : null),
    el("div", { class: "mut small" }, (j.params.platform_name || "") + " · Transmisión completa (automático) · " + fdate(j.created_at) + " · Whisper " + j.params.model
      + " · Detección " + (DETECTOR[j.params.detector] || j.params.detector) + " · objetivo " + j.params.target + " clips"),
    el("div", { class: "small", style: "margin-top:6px" }, el("strong", {}, "Bloques completados: " + done + " de " + n + " (" + Math.round(done / n * 100) + " %)")),
    el("div", { class: "bar" }, el("i", { style: "width:" + Math.round(done / n * 100) + "%" })));
  if (cur) box.append(el("div", { class: "small", style: "margin-top:6px" }, "Ahora: bloque " + (cur.index + 1) + " de " + n + " (" + hms(cur.start) + "–" + hms(cur.end) + " del stream)"),
    el("div", { class: "stages" }, cur.stages.filter((x) => x.status !== "pending" || cur.status === "running").map(stageRow)));
  box.append(el("div", { style: "display:flex;flex-wrap:wrap;gap:3px;margin:8px 0" }, ...j.segments.map((x) => el("span", {
    title: "Bloque " + (x.index + 1) + " · " + hms(x.start) + "–" + hms(x.end) + " · " + (SEG_STATUS[x.status] || x.status) + (x.result && x.result.candidates != null ? " · " + x.result.candidates + " candidatos" : ""),
    style: "width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:" + (CHIP[x.status] || CHIP.pending) }))));
  box.append(el("div", { class: "small" }, "Candidatos encontrados: " + cands + " (" + elig + " cumplen el umbral normal) · Clips finales seleccionados: "
    + (sum ? sum.recommended + " recomendados" + (res.plan && res.plan.length > sum.recommended ? " + " + (res.plan.length - sum.recommended) + " exploratorios" : "") + " de " + sum.target + " pedidos"
      : "todavía ninguno: se eligen al terminar TODOS los bloques")));
  const gs = j.stages.filter((x) => x.status !== "pending");
  if (gs.length) box.append(el("div", { class: "stages" }, gs.map(stageRow)));
  if (sum) box.append(el("div", { class: "small mut" }, "Clips generados: " + rendered + " de " + (res.plan || []).length + " · duplicados evitados: " + sum.duplicates_avoided
    + (res.exploratory && res.exploratory.length ? " · exploratorios disponibles: " + res.exploratory.length : "")));
  for (const w of (j.warnings || []).slice(0, 6)) box.append(el("div", { class: "box warn" }, "⚠ " + w));
  if (j.error) { const b = el("div", { class: "box err" }, el("strong", {}, "No se pudo completar: "), j.error); if (j.hint) b.append(el("div", { class: "mut" }, "Sugerencia: " + j.hint)); box.append(b); }
  for (const x of j.segments.filter((y) => y.status === "failed")) box.append(segCard(x, j));
  const acts = el("div", { class: "row" });
  if (active) acts.append(el("button", { class: "danger fix", onclick: async () => { try { await api("/api/jobs/" + j.id + "/cancel", {}); loadJobs(); } catch (e) { toast(e.message); } } }, "Cancelar"));
  if (["failed", "cancelled", "interrupted"].includes(j.status)) acts.append(el("button", { class: "fix", onclick: async () => { try { await api("/api/jobs/" + j.id + "/retry", {}); loadJobs(); } catch (e) { toast(e.message); } } }, "Continuar (los bloques terminados no se repiten)"));
  if (!active && (rendered > 0 || j.status === "completed")) acts.append(el("a", { href: "#/auto/" + encodeURIComponent(j.id) }, el("button", { class: "primary fix" }, "Ver la galería global")));
  box.append(acts);
  return box;
}
function jobCard(j) {
  if (j.params && j.params.mode === "auto") return autoCard(j);
  const active = j.status === "queued" || j.status === "running";
  const isVod = j.kind === "vod";
  const box = el("div", { class: "job" },
    el("h3", {}, j.title || j.id, "  ", el("span", { class: "badge " + j.status }, STATUS[j.status] || j.status),
      j.status === "queued" && j.queue_position ? el("span", { class: "mut small" }, "  posición " + j.queue_position + " en la cola") : null),
    el("div", { class: "mut small" }, (j.kind === "edit" ? "Edición · " : j.kind === "context" ? "Contexto · " : isVod ? (j.params.platform_name || "") + " VOD por tramos · " : "Procesamiento · ") + fdate(j.created_at) + (j.params && j.params.model ? " · Whisper " + j.params.model : "") + (j.params && j.params.detector ? " · Detección " + (DETECTOR[j.params.detector] || j.params.detector) : "") + (j.params && j.params.clip_preset ? " · Clips " + ({ cortos: "cortos", tiktok: "TikTok/Reels", extendido: "extendidos" }[j.params.clip_preset] || j.params.clip_preset) : "")),
    el("div", { class: "stages" }, j.stages.map(stageRow)));
  if (isVod) {
    const done = j.segments.filter((x) => x.status === "done").length;
    box.append(el("div", { class: "small" }, done + " de " + j.segments.length + " tramo(s) listos"), ...j.segments.map((x) => segCard(x, j)));
  }
  if (j.message && active) box.append(el("div", { class: "mut small" }, j.message));
  for (const w of (j.warnings || []).slice(0, 4)) box.append(el("div", { class: "box warn" }, "⚠ " + w));
  if (j.error) {
    const b = el("div", { class: "box err" }, el("strong", {}, "No se pudo completar: "), j.error);
    if (j.hint) b.append(el("div", { class: "mut" }, "Sugerencia: " + j.hint));
    box.append(b);
  }
  const acts = el("div", { class: "row" });
  if (active) acts.append(el("button", { class: "danger fix", onclick: async () => { try { await api("/api/jobs/" + j.id + "/cancel", {}); loadJobs(); } catch (e) { toast(e.message); } } }, "Cancelar"));
  if (["failed", "cancelled", "interrupted"].includes(j.status)) acts.append(el("button", { class: "fix", onclick: async () => { try { await api("/api/jobs/" + j.id + "/retry", {}); loadJobs(); } catch (e) { toast(e.message); } } }, isVod ? "Continuar con los tramos pendientes y fallidos" : "Reintentar"));
